<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Davi, the Driver</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #9cc8ec; }
    #game { position: fixed; inset: 0; z-index: 0; }
    #game canvas { display: block; }
    /* camadas de tela cheia: fx (overlays de efeitos) < ui (menu, HUD, telas) */
    #fx-layer { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
    #ui-layer { position: fixed; inset: 0; pointer-events: none; z-index: 10; }

    /* =====================================================================
       UI — "arcade retrô brasileiro". Tudo em em: 1em = 16px a 1280x720 e escala junto com a janela.
       Paleta: céu #3a9be8 · terra #c4452b · ipê #ffc928 · tinta #1b1230 · papel #fff4d6
       ===================================================================== */
    #ui-layer {
      --ink: #1b1230; --ink2: rgba(20, 14, 44, .86); --ipe: #ffc928; --paper: #fff4d6; --earth: #c4452b; --sky: #3a9be8;
      --ok: #43d17f; --bad: #ff3b3b;
      font-size: max(11px, min(1.25vw, 2.2222vh));
      font-family: "Segoe UI", "Trebuchet MS", system-ui, -apple-system, Arial, sans-serif;
      color: #fff; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
    }
    #ui-layer *, #ui-layer *::before, #ui-layer *::after { box-sizing: border-box; }
    :where(#ui-layer) button, :where(#ui-layer) input { font: inherit; }
    :where(#ui-layer) button { color: #fff; }
    #ui-layer canvas, #ui-layer .photo-img { image-rendering: pixelated; }
        #ui-layer .mono, #ui-layer .btn, #ui-layer .timer, #ui-layer .score-val, #ui-layer .speed-num, #ui-layer .grade, #ui-layer kbd,
    #ui-layer .bo-paper, #ui-layer .end-head, #ui-layer .mood-name, #ui-layer .toast-title, #ui-layer .card-name,
    #ui-layer h2, #ui-layer h3 { font-family: ui-monospace, "Cascadia Mono", "DejaVu Sans Mono", Menlo, Consolas, "Courier New", monospace; }

    .screen { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: auto; }

    /* ---------- botões ---------- */
    .btn {
      cursor: pointer; background: var(--paper); color: var(--ink); border: .16em solid var(--ink); padding: .5em 1em; font-weight: 800;
      letter-spacing: .08em; font-size: .9em; box-shadow: 0 .22em 0 var(--ink); transition: transform .08s, box-shadow .08s, background .1s;
    }
    .btn:hover { background: #fff; transform: translateY(-.06em); }
    .btn:active { transform: translateY(.18em); box-shadow: 0 .04em 0 var(--ink); }
    .btn.go { background: var(--ipe); }
    .btn.go:hover { background: #ffd95a; }
    .btn.small { padding: .3em .7em; font-size: .75em; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    #ui-layer :focus-visible { outline: .22em solid #7fd0ff; outline-offset: .14em; }

    /* ---------- menu ---------- */
    .menu {
      overflow: auto; align-items: center;
      background:
        repeating-linear-gradient(0deg, rgba(0,0,0,.05) 0 .15em, transparent .15em .3em),
        linear-gradient(180deg, rgba(36,110,190,.9) 0%, rgba(96,176,238,.84) 48%, rgba(240,170,90,.84) 78%, rgba(176,60,38,.94) 100%);
    }
    .skyline { position: absolute; left: 0; bottom: 0; width: 100%; height: auto; pointer-events: none; opacity: .95; }
    .cab {
      position: relative; width: min(74em, 96%); margin: auto; padding: 1em 1.4em 1.2em;
      background: var(--ink2); border: .22em solid var(--ipe); box-shadow: .5em .5em 0 rgba(0,0,0,.45), inset 0 0 0 .22em var(--ink);
    }
    .menu-head { display: flex; align-items: center; justify-content: space-between; gap: 1.2em; margin-bottom: .9em; }
    .title { width: 19em; height: auto; display: block; filter: drop-shadow(.22em .22em 0 rgba(0,0,0,.5)); }
    .head-right { text-align: right; max-width: 30em; }
    .slogan { margin: 0 0 .7em; font-size: 1.05em; color: var(--paper); line-height: 1.35; }
    .head-btns { display: flex; gap: .7em; justify-content: flex-end; }
    .menu-main { display: grid; grid-template-columns: 16em 1fr; gap: 1.3em; align-items: start; }
    .menu h3, .pick > h3 { font-size: .78em; letter-spacing: .2em; color: var(--ipe); margin: 0 0 .5em; }
    .pick > h3:not(:first-child) { margin-top: .9em; }

    .photo { margin: 0; background: var(--paper); color: var(--ink); padding: .6em .6em .4em; transform: rotate(-2deg); box-shadow: .3em .3em 0 rgba(0,0,0,.45); position: relative; border: .14em solid var(--ink); }
    .photo .tape { position: absolute; top: -.7em; left: 50%; width: 5em; height: 1.4em; margin-left: -2.5em; background: rgba(255,201,40,.8); transform: rotate(3deg); border: .08em solid rgba(0,0,0,.2); }
    .photo-frame { width: 100%; aspect-ratio: 1; background: #7cc4f2; border: .14em solid var(--ink); overflow: hidden; }
    .photo-frame .avatar, .photo-frame .photo-img { width: 100%; height: 100%; display: block; object-fit: cover; }
    .photo-frame [hidden] { display: none; } /* o display:block acima anulava [hidden]: a foto ficava fora da moldura */
    .photo figcaption { margin-top: .45em; font-size: .68em; font-weight: 800; text-align: center; letter-spacing: .06em; line-height: 1.25; font-family: ui-monospace, "DejaVu Sans Mono", Consolas, monospace; }
    .records { margin-top: 1.1em; background: rgba(255,255,255,.07); border: .14em solid rgba(255,244,214,.5); padding: .6em .8em; }
    .rec-where { font-size: .7em; opacity: .8; margin-bottom: .4em; line-height: 1.3; }
    .rec-row { display: flex; justify-content: space-between; align-items: baseline; font-size: .85em; padding: .15em 0; }
    .rec-row b { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 1.15em; color: var(--ipe); }
    .rec-runs { font-size: .66em; opacity: .65; margin-top: .3em; }

    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: .8em; }
    .card {
      cursor: pointer; text-align: left; background: var(--paper); color: var(--ink); border: .18em solid var(--ink); padding: .65em .75em .75em;
      display: flex; flex-direction: column; gap: .15em; position: relative; box-shadow: 0 .25em 0 rgba(0,0,0,.5); transition: transform .08s;
    }
    .card:hover { transform: translateY(-.15em); }
    .card.sel { background: #fff; border-color: var(--earth); box-shadow: 0 0 0 .22em var(--ipe), 0 .25em 0 .22em rgba(0,0,0,.5); transform: translateY(-.15em); }
    .card.sel::after { content: "ESCOLHIDO"; position: absolute; top: -.75em; right: .5em; background: var(--earth); color: #fff; font-size: .6em; font-weight: 800; letter-spacing: .12em; padding: .25em .6em; border: .15em solid var(--ink); font-family: ui-monospace, monospace; }
    .card-top { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: .2em; }
    .car { width: 6.4em; height: 3.2em; }
    .lvl { display: flex; gap: .2em; padding-bottom: .2em; }
    .lvl i { width: .7em; height: .7em; background: #ccc4b0; border: .1em solid var(--ink); }
    .lvl i.on { background: var(--earth); }
    .card-name { font-size: 1.05em; font-weight: 900; letter-spacing: .02em; line-height: 1.15; }
    .card-car { font-size: .72em; opacity: .7; font-weight: 700; }
    .card-tag { font-size: .78em; color: var(--earth); font-style: normal; font-weight: 800; margin-top: .25em; }
    .card-desc { margin: .2em 0 0; font-size: .74em; line-height: 1.35; }
    .routes { display: grid; grid-template-columns: 1fr 1fr; gap: .8em; }
    .route {
      cursor: pointer; text-align: left; background: rgba(255,244,214,.12); color: var(--paper); border: .16em solid rgba(255,244,214,.55); padding: .5em .8em;
      display: flex; flex-direction: column; gap: .15em;
    }
    .route b { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 1em; }
    .route-when { font-weight: 700; margin-left: .6em; background: var(--sky); color: #fff; padding: .1em .5em; font-size: .7em; }
    .route span { font-size: .72em; opacity: .85; line-height: 1.3; }
    .route:hover { background: rgba(255,244,214,.22); }
    .route.sel { background: var(--ipe); color: var(--ink); border-color: var(--ink); box-shadow: 0 0 0 .18em var(--ipe); }
    .route.sel span { opacity: .9; }
    .start { display: block; width: 100%; margin-top: 1.1em; font-size: 1.5em; padding: .45em 1em; letter-spacing: .2em; }
    .start::after { content: "▶"; display: inline-block; margin-left: .5em; animation: nudge 1s ease-in-out infinite; }

    /* ---------- janelas (Como jogar / Opções) ---------- */
    .modal { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; pointer-events: auto; background: rgba(10,8,28,.78); z-index: 20; }
    .modal.open { display: flex; }
    .modal-card { width: min(56em, 94%); max-height: 94%; overflow: auto; background: var(--ink); border: .22em solid var(--ipe); box-shadow: .4em .4em 0 rgba(0,0,0,.5); padding: .9em 1.4em 1.3em; }
    .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: .8em; }
    .modal-head h2 { margin: 0; color: var(--ipe); letter-spacing: .14em; font-size: 1.4em; }
    .howto { display: grid; grid-template-columns: 19em 1fr; gap: 1.6em; }
    .howto h3 { font-size: .8em; letter-spacing: .2em; color: var(--ipe); margin-bottom: .5em; }
    .key-row { display: grid; grid-template-columns: 9.5em 1fr; align-items: center; padding: .28em 0; border-bottom: .08em dotted rgba(255,255,255,.2); font-size: .9em; }
    .keys { display: flex; align-items: center; gap: .3em; }
    kbd { background: var(--paper); color: var(--ink); border: .1em solid var(--ink); border-bottom-width: .22em; padding: .05em .45em; font-weight: 800; font-size: .9em; }
    .key-or { font-style: normal; font-size: .7em; opacity: .7; }
    .rule { margin-bottom: .6em; font-size: .84em; line-height: 1.4; }
    .rule b { display: block; color: var(--ipe); font-size: .85em; letter-spacing: .08em; text-transform: uppercase; font-family: ui-monospace, "DejaVu Sans Mono", monospace; }
    .rule span { opacity: .92; }
    .opts { display: flex; flex-direction: column; gap: .3em; min-width: 30em; }
    .opt { display: flex; align-items: center; justify-content: space-between; gap: 1em; padding: .7em 0; border-bottom: .08em dotted rgba(255,255,255,.22); }
    .opt label, .opt-lab { font-weight: 700; }
    .opt-hint { display: block; font-weight: 400; font-size: .72em; opacity: .65; }
    .opt-out { font-family: ui-monospace, monospace; width: 3.2em; text-align: right; color: var(--ipe); font-weight: 700; }
    .opt input[type=range] { width: 14em; accent-color: var(--ipe); margin-left: auto; }
    .switch { cursor: pointer; display: flex; align-items: center; gap: .6em; background: #3a2d66; border: .16em solid var(--paper); padding: .25em .7em .25em .3em; min-width: 9em; }
    .switch .knob { width: 1.2em; height: 1.2em; background: #777; border: .12em solid var(--ink); transition: transform .12s, background .12s; }
    .switch .sw-txt { font-family: ui-monospace, monospace; font-size: .75em; font-weight: 800; letter-spacing: .1em; }
    .switch.on { background: #1f7a4d; }
    .switch.on .knob { background: var(--ipe); transform: translateX(.2em); }
    .seg { display: flex; }
    .seg-btn { cursor: pointer; padding: .4em .9em; background: #3a2d66; border: .16em solid var(--paper); font-family: ui-monospace, monospace; font-weight: 800; font-size: .8em; letter-spacing: .08em; }
    .seg-btn + .seg-btn { border-left: 0; }
    .seg-btn.sel { background: var(--ipe); color: var(--ink); }
    .seg-btn:disabled { opacity: .45; cursor: not-allowed; }

    /* ---------- HUD ---------- */
    .hud { position: absolute; inset: 0; pointer-events: none; }
    .hud > * { position: absolute; }
    .mood-stack { left: 1em; top: 1em; width: 17.5em; display: flex; flex-direction: column; gap: .5em; }
    .mood { display: flex; gap: .6em; padding: .5em .6em .55em; background: var(--ink2); border: .16em solid var(--ipe); box-shadow: .22em .22em 0 rgba(0,0,0,.4); }
    .mood.off { display: none; }
    .mood-passenger { font-size: .82em; border-color: var(--paper); }
    .face-box { flex: none; width: 3.5em; height: 3.5em; border: .14em solid #000; background: #000; align-self: center; }
    .face { width: 100%; height: 100%; display: block; }
    .mood-body { flex: 1; min-width: 0; }
    .mood-head { display: flex; align-items: baseline; gap: .5em; }
    .mood-name { font-size: .95em; letter-spacing: .1em; }
    .mood-sub { font-size: .62em; opacity: .7; text-transform: uppercase; letter-spacing: .1em; }
    .bar { margin-top: .22em; }
    .bar-head { display: flex; justify-content: space-between; font-size: .62em; font-weight: 800; letter-spacing: .12em; line-height: 1.5; }
    .bar-val { font-family: ui-monospace, monospace; opacity: .9; }
    .bar-track { position: relative; height: .95em; background: #0d0820; border: .12em solid #000; overflow: hidden; }
    .bar-fill { position: absolute; inset: 0; background: var(--bc, #43d17f); transform-origin: left center; transform: scaleX(0); }
    .bar.lv0 { --bc: #43d17f; } .bar.lv1 { --bc: #ffd23a; } .bar.lv2 { --bc: #ff8f2a; } .bar.lv3 { --bc: #ff3b3b; }
    .bar-floor { position: absolute; left: 0; top: 0; bottom: 0; width: 0; z-index: 2; border-right: .1em solid #fff;
      background: repeating-linear-gradient(135deg, rgba(255,255,255,.4) 0 .2em, rgba(0,0,0,.45) .2em .4em); }
    .bar-zone { display: none; position: absolute; top: 0; bottom: 0; z-index: 3; border-left: .14em solid var(--paper); border-right: .14em solid var(--paper); background: rgba(255,255,255,.16); }
    .bar-zone.on { display: block; }
    .inzone .bar-zone { background: rgba(120,255,170,.38); border-color: #8affb4; box-shadow: inset 0 0 .5em rgba(120,255,170,.9); }
    .bar-note { position: absolute; right: .5em; top: 50%; transform: translateY(-50%); z-index: 4; font-size: .62em; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: #8affb4; text-shadow: 0 0 .2em #000; }
    .calm-mode .bar-fill { opacity: .85; }
    .bar.hot .bar-track { animation: shake .16s linear infinite; }
    .bar.hot .bar-fill { animation: blink .5s steps(2) infinite; }
    .mood.peak { border-color: var(--bad); }
    .mood.peak .face-box { animation: shake .14s linear infinite; }
    .mood.inzone { border-color: #8affb4; }

    .tr-block { right: 1em; top: 1em; width: 13.5em; }
    .map-frame { line-height: 0; background: #d9c692; border: .2em solid var(--ipe); box-shadow: .22em .22em 0 rgba(0,0,0,.4); }
    .minimap { width: 100%; aspect-ratio: 1; display: block; }
    .road-plate { margin-top: .5em; background: #1f7a4d; border: .14em solid #fff; outline: .14em solid #1f7a4d; padding: .3em .6em; text-align: center; display: flex; flex-direction: column; box-shadow: .2em .2em 0 rgba(0,0,0,.4); }
    .road-name { font-weight: 800; font-size: .88em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dest-info { font-size: .68em; opacity: .92; letter-spacing: .06em; }

    .toasts { top: 1em; left: 50%; transform: translateX(-50%); width: 25em; display: flex; flex-direction: column; align-items: center; gap: .4em; }
    .toast { background: var(--ink2); border: .16em solid #fff; padding: .35em .9em .4em; text-align: center; max-width: 100%; animation: toastIn .22s ease-out; box-shadow: .2em .2em 0 rgba(0,0,0,.4); transition: opacity .3s; }
    .toast.out { opacity: 0; }
    .toast-title { display: block; font-size: .95em; letter-spacing: .08em; }
    .toast-sub { display: block; font-size: .72em; opacity: .92; }
    .toast-what { display: block; font-weight: 800; font-size: .9em; }
    .toast-fine { background: var(--paper); color: var(--ink); border: .2em solid #d6252f; box-shadow: .25em .25em 0 #d6252f; padding: .35em 1.1em .45em; }
    .toast-fine .toast-title { color: #d6252f; font-size: 1.5em; letter-spacing: .16em; line-height: 1.1; }
    .toast-warn { border-color: #ff9a2a; }
    .toast-peak { background: #b01e2c; border-color: #fff; animation: toastIn .22s ease-out, shake .16s linear 4; }

    .bubbles { top: 1em; height: 12em; left: 50%; transform: translateX(-50%); width: 46em; display: flex; justify-content: space-between; gap: 3em; }
    /* ancorados embaixo (perto do carro, mas acima dele): o balão novo fica embaixo e os antigos sobem */
    .bub-col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: .8em; min-width: 0; padding-bottom: .8em; }
    .bub-driver { align-items: flex-end; }
    .bub-passenger { align-items: flex-start; }
    .bubble {
      position: relative; max-width: 100%; width: max-content; background: #fff; color: var(--ink); border: .18em solid var(--ink); border-radius: 1em; padding: .4em .8em .5em;
      font-family: "Comic Sans MS", "Comic Neue", "Chalkboard SE", "Trebuchet MS", "Segoe UI", sans-serif; font-weight: 700; font-size: .9em; line-height: 1.25;
      box-shadow: .2em .2em 0 rgba(0,0,0,.35); animation: pop .22s ease-out; transition: opacity .3s;
    }
    .bubble.out { opacity: 0; }
    .bubble::after { content: ""; position: absolute; bottom: -.62em; width: .9em; height: .9em; background: inherit; border-right: .18em solid var(--ink); border-bottom: .18em solid var(--ink); transform: rotate(45deg); }
    .bub-driver .bubble::after { right: 1.4em; }
    .bub-passenger .bubble::after { left: 1.4em; }
    .bub-row { display: flex; align-items: center; gap: .5em; }
    .bub-gesture { flex: none; width: 42px; height: 42px; image-rendering: crisp-edges; image-rendering: pixelated; }
    @media (min-width: 1700px) { .bub-gesture { width: 56px; height: 56px; } }
    .bubble.loud { font-size: 1.08em; text-transform: uppercase; letter-spacing: .02em; }
    .bubble.gesture-only { padding: .35em .6em; }
    .bub-name { display: block; font-family: ui-monospace, monospace; font-size: .6em; letter-spacing: .14em; opacity: .55; }
    .tone-anx { background: #fff3b0; }
    .tone-stress { background: #ffb8a8; }
    .tone-calm { background: #c9f5d6; }
    .tone-panic { background: #e6cbff; animation: pop .22s ease-out, shake .12s linear 8; }

    .bl-card { left: 1em; bottom: 1em; min-width: 14em; padding: .45em .8em .5em; background: var(--ink2); border: .16em solid var(--ipe); box-shadow: .22em .22em 0 rgba(0,0,0,.4); }
    .timer { font-size: 2em; font-weight: 800; color: var(--paper); line-height: 1.1; font-variant-numeric: tabular-nums; letter-spacing: .03em; }
    .score-row { display: flex; align-items: baseline; gap: .5em; margin-top: .1em; }
    .score-cap { font-size: .6em; letter-spacing: .16em; opacity: .7; font-weight: 800; }
    .score-val { font-size: 1.25em; font-weight: 800; color: var(--ipe); font-variant-numeric: tabular-nums; }
    .score-row.inzone .score-val { color: #8affb4; }
    .mult { margin-left: auto; background: #3a2d66; border: .12em solid #fff; padding: 0 .45em; font-weight: 800; font-size: .9em; font-family: ui-monospace, monospace; }
    .mult.hi { background: #43d17f; color: var(--ink); animation: blink .6s steps(2) infinite; }
    .fines-row { display: flex; justify-content: space-between; gap: 1em; font-size: .7em; margin-top: .3em; letter-spacing: .08em; opacity: .8; font-weight: 700; }
    .fines-row.has { color: #ff9a8a; opacity: 1; }

    .acts { bottom: 1em; left: 50%; transform: translateX(-50%); display: flex; gap: .6em; }
    .act { position: relative; overflow: hidden; display: flex; align-items: center; gap: .45em; padding: .3em .75em .3em .4em; background: var(--ink2); border: .14em solid var(--paper); font-size: .8em; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; transition: background .08s; }
    .act-key { position: relative; z-index: 1; background: var(--paper); color: var(--ink); padding: .05em .45em; font-size: 1.05em; }
    .act-label { position: relative; z-index: 1; }
    .act-cd { position: absolute; inset: 0; background: rgba(0,0,0,.62); transform-origin: bottom center; transform: scaleY(0); }
    .act.wait { opacity: .75; }
    .act.flash { background: var(--ipe); color: var(--ink); }

    .speedo { right: 1em; bottom: 1em; width: 15.5em; padding: .5em .8em .55em; background: var(--ink2); border: .16em solid var(--paper); box-shadow: .22em .22em 0 rgba(0,0,0,.4); display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto auto; column-gap: .8em; row-gap: .3em; align-items: center; }
    .limit-sign { grid-row: 1 / 3; width: 3.5em; height: 3.5em; border-radius: 50%; background: #fff; border: .4em solid #d6252f; color: var(--ink); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 1em; font-family: Arial, Helvetica, sans-serif; }
    .speed-main { display: flex; align-items: baseline; justify-content: flex-end; gap: .35em; }
    .speed-num { font-size: 2.8em; font-weight: 800; line-height: 1; min-width: 2.1ch; text-align: right; font-variant-numeric: tabular-nums; }
    .speed-unit { font-size: .8em; opacity: .8; font-weight: 700; }
    .speed-bar { position: relative; height: .6em; background: #0d0820; border: .1em solid #000; }
    .speed-fill { position: absolute; inset: 0; background: linear-gradient(90deg, #43d17f, #ffd23a); transform-origin: left center; transform: scaleX(0); }
    .speed-tick { display: none; position: absolute; top: -.3em; bottom: -.3em; width: .2em; margin-left: -.1em; background: #fff; }
    .speed-tick.on { display: block; }
    .speed-warn { grid-column: 1 / -1; text-align: center; font-family: ui-monospace, monospace; font-size: .72em; font-weight: 800; letter-spacing: .2em; color: #ff6a5a; visibility: hidden; line-height: 1; margin-top: .1em; }
    .hud.over .speed-num { color: #ff5a4a; }
    .hud.over .speed-fill { background: var(--bad); }
    .hud.over .speed-warn { visibility: visible; animation: blink .4s steps(2) infinite; }
    .hud.over .limit-sign { animation: blink .4s steps(2) infinite; }

    /* ---------- pausa ---------- */
    .pause { background: rgba(10,8,28,.62); }
    .pause-card { width: 22em; max-width: 92%; background: var(--ink); border: .22em solid var(--ipe); box-shadow: .4em .4em 0 rgba(0,0,0,.5); padding: 1em 1.4em 1.3em; text-align: center; }
    .pause-title { margin: 0; font-size: 2em; letter-spacing: .24em; color: var(--ipe); }
    .pause-quip { margin: .4em 0 .2em; font-size: .85em; opacity: .85; }
    .pause-label { font-size: .68em; letter-spacing: .1em; opacity: .6; margin-bottom: .9em; }
    .pause-btns { display: flex; flex-direction: column; gap: .6em; }
    .pause-btns .btn { width: 100%; }

    /* ---------- fim de viagem ---------- */
    .end { background: rgba(10,8,28,.76); overflow: auto; }
    .end-card { width: min(58em, 96%); margin: auto; padding: 1em 1.5em 1.2em; background: var(--ink); border: .22em solid var(--ipe); box-shadow: .4em .4em 0 rgba(0,0,0,.5); }
    .end-kicker { font-family: ui-monospace, monospace; font-size: .72em; letter-spacing: .18em; opacity: .7; text-transform: uppercase; margin-bottom: .5em; }
    .arrived { display: grid; grid-template-columns: 14em 1fr; gap: 1.6em; align-items: start; }
    .grade-col { text-align: center; }
    .grade { font-size: 8em; font-weight: 900; line-height: 1; color: var(--gc, #fff); text-shadow: .06em .06em 0 #000, 0 0 .4em rgba(255,255,255,.15); }
    .grade-title { font-weight: 800; color: var(--ipe); font-size: 1.15em; line-height: 1.2; margin-top: .2em; }
    .grade-quip { font-size: .8em; opacity: .85; margin-top: .5em; line-height: 1.35; }
    .end-head { margin: 0 0 .3em; font-size: 1.9em; letter-spacing: .12em; color: var(--ipe); margin-bottom: .3em; }
    .end-head.big { font-size: 2.2em; }
    .stat { display: flex; justify-content: space-between; align-items: baseline; gap: 1em; padding: .3em 0; border-bottom: .08em dotted rgba(255,255,255,.3); }
    .stat-k { font-size: .72em; letter-spacing: .14em; opacity: .8; font-weight: 700; }
    .stat-v { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 1.6em; font-weight: 800; text-align: right; }
    .stat.warn .stat-v { color: #ff8a7a; }
    .badge { font-style: normal; background: var(--ipe); color: var(--ink); padding: .1em .5em; font-size: .45em; margin-left: .8em; vertical-align: middle; letter-spacing: .1em; animation: blink .7s steps(2) infinite; }
    .stat-prev { font-size: .4em; opacity: .6; margin-left: .8em; font-weight: 600; }
    .fines-box { margin-top: .7em; background: rgba(255,255,255,.07); border: .12em solid rgba(255,244,214,.4); padding: .5em .8em; }
    .fines-head { display: flex; justify-content: space-between; font-size: .82em; letter-spacing: .1em; }
    .fines-head b { font-family: ui-monospace, monospace; }
    .fines-list { margin-top: .3em; }
    .fine-line { display: flex; justify-content: space-between; gap: 1em; font-size: .76em; padding: .12em 0; }
    .fine-val { font-family: ui-monospace, monospace; white-space: nowrap; }
    .fines-cnh { margin-top: .3em; font-size: .72em; color: #ff9a8a; text-align: right; font-weight: 700; }
    .other { display: flex; gap: 1.4em; align-items: center; }
    .end-face { width: 9em; height: 9em; border: .2em solid #000; flex: none; }
    .other-txt { flex: 1; }
    .end-sub { margin: 0 0 .8em; font-size: .95em; opacity: .9; }
    .end-actions { display: flex; gap: .8em; justify-content: center; margin-top: 1.1em; }
    .end-actions .btn { min-width: 11em; }

    .end-bateu { background: none; border: 0; box-shadow: none; padding: .5em 0; width: min(64em, 96%); }
    .bo-paper {
      position: relative; background: #fff8e0; color: #2a2438; border: .18em solid var(--ink); padding: .7em 1.3em 1em; box-shadow: .35em .35em 0 rgba(0,0,0,.5); transform: rotate(-.5deg);
      background-image: repeating-linear-gradient(180deg, transparent 0 1.5em, rgba(80,70,120,.08) 1.5em 1.55em);
    }
    .bo-top { display: flex; justify-content: space-between; align-items: baseline; border-bottom: .16em solid var(--ink); font-weight: 800; letter-spacing: .14em; padding-bottom: .25em; font-size: .85em; }
    .bo-sub { font-size: .7em; letter-spacing: .04em; opacity: .65; font-weight: 600; }
    .bo-title { margin: .25em 0 0; font-size: 2em; color: #c01f2b; letter-spacing: .05em; line-height: 1.1; }
    .bo-lead { font-size: .78em; font-style: italic; opacity: .8; margin-bottom: .3em; }
    .bo-cols { display: grid; grid-template-columns: 1.15fr 1fr; gap: 1.4em; margin-top: .4em; }
    .bo-field { display: grid; grid-template-columns: 7.2em 1fr; gap: .5em; font-size: .8em; padding: .22em 0; border-bottom: .08em dashed #a39a78; line-height: 1.3; }
    .bo-k { opacity: .65; text-transform: uppercase; letter-spacing: .06em; font-size: .85em; }
    .bo-v { font-weight: 700; }
    .bo-version { position: relative; background: #fff; border: .14em solid var(--ink); padding: .5em .8em .8em; }
    .bo-version-h { font-size: .7em; font-weight: 800; letter-spacing: .14em; opacity: .7; }
    .bo-quote { margin: .3em 0 0; font-family: "Comic Sans MS", "Comic Neue", "Trebuchet MS", "Segoe UI", sans-serif; font-style: italic; font-weight: 700; font-size: .95em; line-height: 1.3; }
    .bo-fault { position: absolute; right: -.5em; bottom: -.95em; transform: rotate(-6deg); border: .2em solid #c01f2b; color: #c01f2b; background: rgba(255,248,224,.92); padding: .05em .6em; font-weight: 900; letter-spacing: .12em; font-size: .9em; }
    .bo-quote-box { margin-top: 1.4em; border: .14em dashed var(--ink); padding: .4em .7em .5em; }
    .bo-quote-box .fine-line { font-size: .74em; }
    .bo-total { display: flex; justify-content: space-between; border-top: .14em solid var(--ink); margin-top: .2em; padding-top: .2em; font-size: .95em; color: #c01f2b; }
    .bo-damage { margin: .3em 0 0; font-size: .82em; line-height: 1.35; }
    .bo-note { font-size: .62em; opacity: .7; font-style: italic; margin-top: .2em; }

    /* ---------- toque ---------- */
    .touch { position: absolute; inset: 0; pointer-events: none; }
    .tbtn { pointer-events: auto; touch-action: none; cursor: pointer; background: rgba(20,14,44,.7); border: .18em solid var(--paper); color: #fff; font-family: ui-monospace, monospace; font-weight: 800; border-radius: .6em; }
    .tbtn.down { background: var(--ipe); color: var(--ink); }
    .t-left { position: absolute; left: 1em; bottom: 1em; display: flex; gap: 1em; }
    .tbtn.steer { width: 5em; height: 5em; font-size: 1.4em; }
    .t-right-cluster { position: absolute; right: 1em; bottom: 1em; display: grid; grid-template-columns: 6em 6em; gap: .8em; }
    .tbtn.pedal { height: 5.5em; font-size: .9em; }
    .tbtn.gas { background: rgba(46,160,90,.75); }
    .tbtn.brake { background: rgba(190,50,50,.75); }
    .t-right-cluster .small { grid-column: 1 / -1; height: 2.4em; }
    .t-acts { position: absolute; right: 1em; bottom: 18em; display: flex; flex-direction: row; gap: .5em; }
    .t-acts .tbtn.small { min-width: 2.8em; height: 2.6em; }
    .tbtn.small { padding: .4em .8em; font-size: .8em; }
    .t-pause { position: absolute; left: 50%; bottom: 1em; margin-left: -1.5em; width: 3em; height: 2.6em; }
    .is-touch .bl-card { bottom: 8em; }
    .is-touch .speedo { bottom: 10.5em; }
    .is-touch .acts { display: none; }

    /* ---------- animações ---------- */
    @keyframes shake { 0%, 100% { transform: translate(0, 0); } 25% { transform: translate(.08em, -.06em); } 50% { transform: translate(-.08em, .06em); } 75% { transform: translate(.06em, .08em); } }
    @keyframes blink { 50% { opacity: .55; } }
    @keyframes nudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(.3em); } }
    @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes toastIn { from { transform: translateY(-.8em); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      #ui-layer *, #ui-layer *::before { animation: none !important; transition: none !important; }
    }
    /* telas baixas (celular em paisagem): menu rola em vez de cortar */
    @media (max-height: 520px) { .menu { align-items: flex-start; } }
    /* celular em paisagem (≈ 667×375 a 932×430): letra um pouco menor e só o essencial do menu, sem cortar */
    @media (max-height: 460px) {
      #ui-layer { font-size: max(9px, min(1.25vw, 2.45vh)); }
      .card-desc, .photo figcaption { display: none; }
      .slogan { margin-bottom: .3em; }
      /* balões abaixo da faixa dos avisos (no celular o balão só de gesto caía em cima do toast) */
      .bubbles { top: 7.2em; height: 10em; }
    }
    .is-touch .bubbles { top: 7.2em; height: 10em; }
    /* retrato no celular: pede para girar */
    #rotate-hint { display: none; }
    @media (orientation: portrait) and (max-width: 600px) {
      #rotate-hint { display: flex; position: fixed; inset: 0; z-index: 50; align-items: center; justify-content: center; flex-direction: column;
        gap: 1em; background: #1b1230; color: #fff4d6; font: 700 20px/1.3 "Segoe UI", system-ui, sans-serif; text-align: center; padding: 2em; }
      #rotate-hint b { font-size: 56px; display: block; transform: rotate(90deg); }
    }
  </style>
</head>
